name: Auto-sqlancer CI

on:
  push:
  pull_request:

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Docker
        run: docker --version

      - name: Build sqlancer image
        run: python3 start.py build --sqlancer

      - name: Build DBMS images
        run: python3 start.py build --dbms all 
  test-dbs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Docker
        run: docker --version

      - name: Test mysql
        run: python3 start.py test --dbms mysql --config mysql/config.json

      - name: Test postgres
        run: python3 start.py test --dbms postgres --config postgres/config.json
      
      - name: Test sqlite
        run: python3 start.py test --dbms sqlite --config sqlite/config.json
      
      - name: Test tidb
        run: python3 start.py test --dbms tidb --config tidb/config.json 
      
      - name: Test cockroachdb
        run: python3 start.py test --dbms cockroachdb --config cockroachdb/config.json
      
      - name: Test duckdb
        run: python3 start.py test --dbms duckdb --config duckdb/config.json
